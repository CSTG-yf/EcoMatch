s2:
  schema:
    cache:
      enable: true

  parser:
    strategy: ONE_PASS_SELF_CONSISTENCY
    exemplar-recall:
      number: 10
    few-shot:
      number: 5
    self-consistency:
      number: 1
    multi-turn:
      enable: false

  corrector:
    additional:
      information: true
    date: true

  demo:
    # 银行问数专用系统：不初始化任何样例助理/样例主题域（S2VisitsDemo 等）。
    # 唯一助理「银行问数」由 evaluation/bank_nl2sql/bootstrap_bank_agent.py 导入。
    # demo 数据库和 demo 聊天模型也随此开关关闭；正式模型由管理员在启动后配置。
    names: []
    enableLLM: true

  authentication:
    enable: true
    exclude:
      path: /api/auth/user/register,/api/auth/user/login
    token:
      http:
        header:
          key: Authorization

  mapper:
    name:
      threshold: 0.30
      min:
        threshold:value: 0.25
    value:
      threshold: 0.5
      min:
        threshold: 0.3
    embedding:
      use-llm-enhance: true
